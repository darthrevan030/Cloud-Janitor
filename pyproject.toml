[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-janitor"
version = "0.3.0"
description = "Multi-agent cloud infrastructure auditor and remediation system using MCP protocol"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.0",
    "boto3>=1.34.0",
    "click>=8.1.0",
    "filelock>=3.13.0",
    "mcp>=1.28.1",
    "openai>=2.44.0",
    "packaging>=24.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "terraform-local>=0.26.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.45.0"]
gcp = ["google-auth>=2.30.0", "google-cloud-compute>=1.19.0", "google-cloud-redis>=2.16.0"]
azure = ["azure-identity>=1.17.0", "azure-mgmt-compute>=33.0.0", "azure-mgmt-network>=27.0.0", "azure-mgmt-redis>=14.4.0"]

[project.scripts]
cloud-janitor = "cloud_janitor.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "moto[ec2,elasticache,cloudwatch]>=5.0.0",
    "mypy>=1.10.0",
    "pytest>=9.1.1",
    "ruff>=0.4.0",
    "pytest-xdist",
    "build>=1.5.0",
    "twine>=6.2.0",
    "streamlit>=1.58.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_janitor"]

[tool.hatch.build.targets.wheel.force-include]
"src/cloud_janitor/hooks/pre-remediation.sh" = "cloud_janitor/hooks/pre-remediation.sh"
"src/cloud_janitor/hooks/post-remediation.sh" = "cloud_janitor/hooks/post-remediation.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.mypy]
packages = ["cloud_janitor"]
mypy_path = "src"
strict = false
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "apscheduler.*", "mcp.*", "streamlit.*", "google.*", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cloud_janitor.core.state_store"]
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = ["cloud_janitor.app"]
disable_error_code = ["import-untyped"]
