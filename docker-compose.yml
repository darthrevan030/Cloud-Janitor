# Base config — works with LocalStack Community (free, no auth token needed for basic services)
# For Pro features (ElastiCache, etc.), use: docker-compose -f docker-compose.yml -f docker-compose.pro.yml up -d
services:
  localstack:
    image: localstack/localstack:4.4.0
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      - SERVICES=ec2,s3
      - AWS_DEFAULT_REGION=us-east-1
    # No docker.sock mount needed — ec2/s3 don't use container-mode emulation
